name: Importar build NEXUS GRID TESTE

on:
  push:
    paths:
      - '.github/workflows/import-build.yml'

permissions:
  contents: write

jobs:
  importar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar build homologado
        run: |
          curl -L --fail "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-935c-820e-907c-745007ed1012/raw?se=2026-09-13T16%3A48%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=224dc9fb-d734-5b09-bfda-fa014ee47c58&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-13T11%3A29%3A51Z&ske=2026-09-14T11%3A29%3A51Z&sks=b&skv=2026-02-06&sig=6%2BOTqqKYoknoGnQ6HJzObniGpQ4dY8QnDSsYOzURBVY%3D" -o build.zip
          rm -rf _build
          mkdir _build
          unzip -q build.zip -d _build

      - name: Publicar somente arquivos compilados
        run: |
          rm -rf assets index.html _redirects pilot-hotfix.css sidebar-push.css
          cp -R _build/. .
          touch .nojekyll
          rm -rf _build build.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publicar build homologado do NEXUS GRID TESTE" || exit 0
          git push
