name: Importar build NEXUS GRID TESTE

on:
  push:
    paths:
      - '.github/workflows/import-build.yml'

permissions:
  contents: write

jobs:
  importar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar build homologado
        run: |
          curl -L --fail "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-408c-820e-8247-679bef9834bf/raw?se=2026-09-12T23%3A33%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=31b3832c-9e2d-5017-aa92-4d3968126017&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T11%3A37%3A36Z&ske=2026-09-13T11%3A37%3A36Z&sks=b&skv=2026-02-06&sig=cyq%2BAw5vw3pTJvgaQh%2BHlDaOb5we9%2BvuYMFcdW8HLdI%3D" -o build.zip
          rm -rf _build
          mkdir _build
          unzip -q build.zip -d _build

      - name: Publicar somente arquivos compilados
        run: |
          rm -rf assets index.html _redirects pilot-hotfix.css
          cp -R _build/. .
          touch .nojekyll
          rm -rf _build build.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publicar build homologado do NEXUS GRID TESTE" || exit 0
          git push
