name: Importar build NEXUS GRID TESTE

on:
  push:
    paths:
      - '.github/workflows/import-build.yml'

permissions:
  contents: write

jobs:
  importar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar build homologado
        run: |
          curl -L --fail "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-007c-820e-9a0a-59217f5f80e3/raw?se=2026-09-12T23%3A24%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=dadfd208-f2a3-5840-bff7-91ac0ec4a676&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-12T12%3A43%3A51Z&ske=2026-09-13T12%3A43%3A51Z&sks=b&skv=2026-02-06&sig=fCG9vZpwHiiWhFRk4oEVudNale/qTr%2BsCCkm8G%2BGcdM%3D" -o build.zip
          rm -rf _build
          mkdir _build
          unzip -q build.zip -d _build

      - name: Publicar somente arquivos compilados
        run: |
          rm -rf assets index.html _redirects pilot-hotfix.css
          cp -R _build/. .
          touch .nojekyll
          rm -rf _build build.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publicar build homologado do NEXUS GRID TESTE" || exit 0
          git push
